<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RutaExpress</title>
  <meta name="description" content="Guía de paradas de transporte, rutas, horarios y tarifas de tu ciudad.">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RutaExpress">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Captura temprana del evento de instalación: puede llegar antes de que carguen los módulos
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__eventoInstalacion = e;
      window.dispatchEvent(new Event('instalacion-disponible'));
    });
  </script>
  <script src="js/plantilla-ficha.js"></script>
  <script src="js/db.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Splash dentro de la app (el del sistema lo genera el navegador a partir del manifiesto) -->
  <div id="splash" class="splash" role="status" aria-label="Cargando RutaExpress">
    <img src="icons/icon-192.png" alt="" width="120" height="120">
    <div class="splash__nombre">RutaExpress</div>
    <div>Tu guía de paradas y rutas</div>
  </div>

  <!-- ===== APP SHELL: cabecera, navegación, contenido y pie ===== -->
  <header class="barra">
    <a class="marca" href="#/">
      <span class="marca__logo" aria-hidden="true">🚌</span>
      <span class="marca__nombre">RutaExpress</span>
    </a>
    <span class="conexion" data-conexion role="status" aria-live="polite" hidden></span>
  </header>

  <main id="contenido" class="contenido" tabindex="-1">
    <!-- Las vistas se dibujan aquí desde JavaScript (CSR) -->
    <section class="tarjeta">
      <h1>Bienvenido a RutaExpress</h1>
      <p>Cargando…</p>
    </section>
  </main>

  <nav class="menu" aria-label="Navegación principal">
    <a href="#/" data-ruta="inicio"><span aria-hidden="true">🏠</span>Inicio</a>
    <a href="#/paradas" data-ruta="paradas"><span aria-hidden="true">🚏</span>Paradas</a>
    <a href="#/cerca" data-ruta="cerca"><span aria-hidden="true">📍</span>Cerca</a>
    <a href="#/avisos" data-ruta="avisos"><span aria-hidden="true">🔔</span>Avisos</a>
    <a href="#/ajustes" data-ruta="ajustes"><span aria-hidden="true">⚙️</span>Ajustes</a>
  </nav>
</body>
</html>
