<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sin conexión · RutaExpress</title>
  <meta name="theme-color" content="#b8452a">
  <style>
    /* Estilos en línea: esta página debe verse aunque no haya nada más en caché */
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5eee3; color: #2a1d14; text-align: center;
    }
    .caja { max-width: 420px; }
    .icono { font-size: 64px; }
    h1 { margin: 8px 0; }
    p { opacity: .92; line-height: 1.5; }
    a, button {
      display: inline-block; margin: 6px; padding: 12px 20px; border-radius: 999px; border: 0;
      background: #b8452a; color: #fff; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="caja">
    <div class="icono" aria-hidden="true"><svg width="72" height="72" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#b8452a"/><path d="M8 26V14a8 8 0 0 1 16 0v12" fill="none" stroke="#f6efe3" stroke-width="3"/><path d="M16 26v-5" stroke="#e9a23b" stroke-width="3" stroke-linecap="round" stroke-dasharray="2.5 3"/></svg></div>
    <h1>Estás sin conexión</h1>
    <p>Esta página no se guardó para usarse sin internet. Las paradas que ya consultaste y el catálogo
       siguen disponibles desde el inicio de la app.</p>
    <p>Los comentarios que escribas se enviarán solos cuando vuelva la señal.</p>
    <a href="./#/paradas">Ver paradas guardadas</a>
    <button onclick="location.reload()">Reintentar</button>
  </main>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
